# PAUSED: `open-pull-requests-limit: 0` on each entry stops Dependabot opening
# version-update PRs. Updates are taken by hand, on a branch, and tested
# (/sammy-pack-setup step 5) before they merge. To resume, set the limits back
# (npm: 5, github-actions: the default) — the groups and ignores below are
# ready.
#
# Keeps dependencies current through PRs that run the full CI.
#
# The Claude Agent SDK ships almost daily and carries the Claude Code runtime
# every run uses, so it gets its own weekly PR (with the MCP SDK and the
# Anthropic client it pairs with). React Native moves as one release train —
# react-native, its @react-native/* tooling, the CLI and the React version it
# pins — and a 0.x "minor" there breaks types, so it gets its own PR too.
# Everything else is batched into one weekly PR for minor/patch bumps; majors
# arrive one per PR so each can be read.
version: 2
updates:
  - package-ecosystem: npm
    directory: /app # the workspace root: covers app/packages/* through its lockfile
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0 # paused — see the top of this file
    commit-message:
      prefix: deps
    groups:
      claude:
        patterns:
          - '@anthropic-ai/*'
          - '@modelcontextprotocol/*'
      react-native:
        patterns:
          - 'react-native'
          - '@react-native/*'
          - '@react-native-community/*'
          - 'react'
          - 'react-dom'
          - 'react-test-renderer'
          - '@types/react'
          - '@types/react-dom'
          - '@types/react-test-renderer'
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns:
          - '@anthropic-ai/*'
          - '@modelcontextprotocol/*'
          - 'react-native'
          - '@react-native/*'
          - '@react-native-community/*'
          - 'react'
          - 'react-dom'
          - 'react-test-renderer'
          - '@types/react'
          - '@types/react-dom'
          - '@types/react-test-renderer'
    ignore:
      # React Native's template pins its CLI and Babel 7. Take a major of
      # either by hand, when a React Native release's template adopts it.
      - dependency-name: '@react-native-community/cli*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@babel/*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0 # paused — see the top of this file
    commit-message:
      prefix: ci
